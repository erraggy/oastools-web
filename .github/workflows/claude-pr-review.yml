name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Focus on:
            - Code quality and Go best practices
            - Potential bugs or edge cases
            - Security concerns (especially for web handlers)
            - Consistency with existing codebase patterns

            Use `gh pr diff ${{ github.event.pull_request.number }}` to see changes.
            Post your review using `gh pr comment ${{ github.event.pull_request.number }}`.
            Be concise and actionable.
          claude_args: |
            --model opus
            --allowedTools "Bash(gh:*),Read,Glob,Grep"
          additional_permissions: |
            actions: read

name: Claude PR Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    # Run if: PR opened OR /review comment on a PR
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review'))
    permissions:
      contents: write  # Allow Claude to push commits to PRs
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ steps.pr.outputs.number }}.

            Focus on:
            - Code quality and Go best practices
            - Potential bugs or edge cases
            - Security concerns (especially for web handlers)
            - Consistency with existing codebase patterns

            Be concise and actionable.

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Model and tool configuration
          # Custom instructions are read from CLAUDE.md and AGENTS.md in the repo
          claude_args: |
            --model=opus
            --allowed-tools "Bash(gh:*)"

      - name: Post review as PR comment
        if: always() && steps.claude.outputs.execution_file
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # Extract the final assistant message from the execution output
          REVIEW=$(jq -r '
            [.[] | select(.type == "assistant") | .message.content[]? |
             select(.type == "text") | .text] | last // empty
          ' "$EXECUTION_FILE")

          if [ -n "$REVIEW" ]; then
            # Post the review as a PR comment
            gh pr comment ${{ steps.pr.outputs.number }} --body "## 🤖 Claude Code Review

          $REVIEW

          ---
          *Generated by [Claude Code](https://claude.ai/code) via GitHub Actions*"
          else
            echo "No review content found in execution output"
          fi

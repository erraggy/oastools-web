# This workflow builds and tests the Go project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install golangci-lint
        # Version is pinned in the Makefile so local and CI lint identically.
        run: make install-linter

      - name: Install yamllint
        run: pip install yamllint

      - name: Run Check (Tidy, Format, Vet, Lint, Test, Build, Verify)
        run: make check

      - name: Verify no uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working directory is dirty after running checks."
            echo "Please run 'make check' locally and commit the changes."
            git status
            git diff
            exit 1
          fi

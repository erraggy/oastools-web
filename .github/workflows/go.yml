# This workflow builds and tests the Go project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install golangci-lint v2
        run: |
          # Install v2.7.2 from source for Go 1.25 compatibility
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2

      - name: Run Check (Tidy, Format, Vet, Lint, Test, Build, Verify)
        run: make check

      - name: Verify no uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working directory is dirty after running checks."
            echo "Please run 'make check' locally and commit the changes."
            git status
            git diff
            exit 1
          fi

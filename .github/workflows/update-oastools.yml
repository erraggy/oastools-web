# Automatically bumps the oastools dependency when a new release is published.
# Triggered via repository_dispatch from the oastools release workflow.
# Runs make check, creates a PR, admin-merges, and deploys via Cloud Build.

name: Update oastools

on:
  repository_dispatch:
    types: [oastools-release]

jobs:
  update:
    runs-on: ubuntu-latest
    # The go get step below may wait out a checksum database lag of several
    # minutes before the rest of this job -- linters, checks, PR merge, and a
    # Cloud Build deploy -- even begins.
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.OASTOOLS_WEB_PAT }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Update oastools
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "Missing client_payload.version in repository_dispatch event" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version format: $VERSION" >&2
            exit 1
          fi

          # oastools dispatches this workflow immediately after its release
          # workflow finishes, roughly two minutes after the tag is pushed.
          # Neither proxy.golang.org nor sum.golang.org has indexed the new
          # version by then, so go get cannot fetch or verify the module. On
          # v1.54.0 and v1.55.0 this showed up as sum.golang.org answering
          # 500-504 for a few minutes while proxy.golang.org already had the
          # module. On v1.58.0, proxy.golang.org itself had not indexed the
          # tag yet either (confirmed directly against
          # proxy.golang.org/.../@v/<version>.info), which sum.golang.org
          # reports as 404 rather than 5xx. Both are the same condition --
          # "not indexed yet" -- so both are retried.
          #
          # Retrying rather than sleeping a fixed amount: the lag is not
          # reliably bounded, so a fixed wait either burns time on every release
          # or still loses the race.
          #
          # The pattern matches only a failed HTTP fetch of the checksum
          # database. It deliberately does not match on "verifying module" or on
          # sum.golang.org alone, because a checksum *mismatch* reports both --
          # and a mismatch means the downloaded module disagrees with the signed
          # record, which must fail on the first attempt rather than being
          # retried. Anchoring on "reading https://" separates the two: a
          # mismatch never reports an HTTP status.
          #
          # Ten attempts at 60s covers the roughly four-minute lag measured on
          # v1.54.0 and v1.55.0, plus headroom for the longer (10+ minute)
          # proxy-indexing lag observed on v1.58.0. Keep that inside the job's
          # timeout-minutes with room for the deploy that follows.
          for attempt in $(seq 1 10); do
            if out=$(go get "github.com/erraggy/oastools@${VERSION}" 2>&1); then
              echo "$out"
              break
            fi
            echo "$out"

            if ! grep -qE 'reading https://sum\.golang\.org/.*: (404|500|502|503|504) ' <<<"$out"; then
              echo "go get failed for a reason other than checksum database availability" >&2
              exit 1
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "sum.golang.org still had not indexed ${VERSION} after 10 attempts" >&2
              exit 1
            fi

            echo "Checksum database has not indexed ${VERSION} yet (attempt ${attempt}/10); retrying in 60s"
            sleep 60
          done

          go mod tidy

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2
          pip install yamllint

      - run: make check

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.OASTOOLS_WEB_PAT }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          BRANCH="chore/bump-oastools-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add go.mod go.sum
          git commit -m "chore: bump oastools to ${VERSION}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --title "chore: bump oastools to ${VERSION}" \
            --body "Automated dependency update triggered by oastools ${VERSION} release."
          gh pr merge --admin --squash

      - name: Sync to merged main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: google-github-actions/auth@v2
        with:
          # yamllint disable-line rule:line-length
          workload_identity_provider: "projects/222514409878/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "github-actions@oastools-web.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: oastools-web

      - name: Deploy via Cloud Build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          APP_VERSION=$(git describe --tags --always)
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --region=us-central1 \
            --substitutions=SHORT_SHA="${SHORT_SHA}",_APP_VERSION="${APP_VERSION}"

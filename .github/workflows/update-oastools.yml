# Automatically bumps the oastools dependency when a new release is published.
# Triggered via repository_dispatch from the oastools release workflow.
# Runs make check, creates a PR, admin-merges, and deploys via Cloud Build.

name: Update oastools

on:
  repository_dispatch:
    types: [oastools-release]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.OASTOOLS_WEB_PAT }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Update oastools
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "Missing client_payload.version in repository_dispatch event" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid version format: $VERSION" >&2
            exit 1
          fi

          # oastools dispatches this workflow immediately after its release
          # workflow finishes, roughly two minutes after the tag is pushed.
          # sum.golang.org has not indexed the new version by then and answers
          # 500, so go get cannot verify the module. proxy.golang.org is already
          # serving it; only the checksum database lags, by around four minutes
          # on both v1.54.0 and v1.55.0.
          #
          # Retrying rather than sleeping a fixed amount: the lag is not
          # reliably bounded, so a fixed wait either burns time on every release
          # or still loses the race. Only the checksum-availability failure is
          # retried — anything else fails immediately rather than spending ten
          # minutes confirming a real error.
          for attempt in 1 2 3 4 5 6; do
            if out=$(go get "github.com/erraggy/oastools@${VERSION}" 2>&1); then
              echo "$out"
              break
            fi
            echo "$out"

            if ! grep -qE 'sum\.golang\.org.*(500|502|503|504)|verifying module' <<<"$out"; then
              echo "go get failed for a reason unrelated to checksum database availability" >&2
              exit 1
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "sum.golang.org still had not indexed ${VERSION} after 6 attempts" >&2
              exit 1
            fi

            echo "Checksum database has not indexed ${VERSION} yet (attempt ${attempt}/6); retrying in 90s"
            sleep 90
          done

          go mod tidy

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2
          pip install yamllint

      - run: make check

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.OASTOOLS_WEB_PAT }}
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          BRANCH="chore/bump-oastools-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add go.mod go.sum
          git commit -m "chore: bump oastools to ${VERSION}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --title "chore: bump oastools to ${VERSION}" \
            --body "Automated dependency update triggered by oastools ${VERSION} release."
          gh pr merge --admin --squash

      - name: Sync to merged main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: google-github-actions/auth@v2
        with:
          # yamllint disable-line rule:line-length
          workload_identity_provider: "projects/222514409878/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "github-actions@oastools-web.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: oastools-web

      - name: Deploy via Cloud Build
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          APP_VERSION=$(git describe --tags --always)
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --region=us-central1 \
            --substitutions=SHORT_SHA="${SHORT_SHA}",_APP_VERSION="${APP_VERSION}"

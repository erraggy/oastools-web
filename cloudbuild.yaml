steps:
  # Get version from substitution or git describe
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -n "${_APP_VERSION}" ]; then
          APP_VERSION="${_APP_VERSION}"
          echo "Using substitution version: $$APP_VERSION"
        else
          git fetch --unshallow --tags 2>/dev/null || git fetch --tags
          APP_VERSION=$$(git describe --tags --always)
          echo "Detected version: $$APP_VERSION"
        fi
        echo "$$APP_VERSION" > /workspace/version.txt

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        APP_VERSION=$$(cat /workspace/version.txt)
        echo "Building with VERSION=$$APP_VERSION"
        docker build \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$$APP_VERSION \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$SHORT_SHA \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:latest \
          --build-arg VERSION=$$APP_VERSION \
          .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'oastools'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '60s'
      - '--concurrency'
      - '80'
      - '--allow-unauthenticated'
      - '--update-env-vars'
      - 'METRICS_ENABLED=true'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:latest'

substitutions:
  _APP_VERSION: ''

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

steps:
  # Get version from git describe
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'git describe --tags --always > /workspace/version.txt'

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        VERSION=$(cat /workspace/version.txt)
        docker build \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$$VERSION \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$SHORT_SHA \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:latest \
          --build-arg VERSION=$$VERSION \
          .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'oastools'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '2'
      - '--timeout'
      - '60s'
      - '--concurrency'
      - '80'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/oastools-web/server:latest'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET


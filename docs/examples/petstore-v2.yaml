openapi: 3.1.0
info:
  title: Petstore API
  version: 2.0.0
  description: A sample API for managing pets in a store

servers:
  - url: https://api.petstore.example.com/v2

paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: Pagination cursor
          schema:
            type: string
      responses:
        '200':
          description: A paginated list of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetList'
    post:
      summary: Create a pet
      operationId: createPet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'

  /pets/{petId}:
    get:
      summary: Get a pet by ID
      operationId: getPet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

  /pets/{petId}/vaccinations:
    post:
      summary: Record a vaccination
      operationId: addVaccination
      tags:
        - pets
        - health
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vaccination'
      responses:
        '201':
          description: Vaccination recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaccination'
        '404':
          description: Pet not found

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
        - species
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Pet's name
        species:
          type: string
          enum: [dog, cat, bird, fish, rabbit]
        breed:
          type: string
          description: Pet's breed
        age:
          type: integer
          description: Age in years
        microchipId:
          type: string
          description: Microchip identifier for tracking
        status:
          type: string
          enum: [available, pending, sold]
          default: available

    NewPet:
      type: object
      required:
        - name
        - species
      properties:
        name:
          type: string
        species:
          type: string
          enum: [dog, cat, bird, fish, rabbit]
        breed:
          type: string
        age:
          type: integer
        microchipId:
          type: string

    PetList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Pet'
        nextCursor:
          type: string
          description: Cursor for the next page
        totalCount:
          type: integer
          description: Total number of pets

    Vaccination:
      type: object
      required:
        - vaccine
        - administeredAt
      properties:
        id:
          type: string
        vaccine:
          type: string
          description: Name of the vaccine
        administeredAt:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
        veterinarian:
          type: string

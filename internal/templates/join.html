{{template "base" .}}

{{define "title"}}Join - oastools{{end}}

{{define "content"}}
<section class="operation-page">
    <h1>Join OpenAPI Specifications</h1>
    <p>Merge multiple OpenAPI specifications into a single document.</p>

    <form hx-post="/api/join"
          hx-target="#result"
          hx-indicator="#spinner"
          hx-swap="innerHTML"
          enctype="multipart/form-data">
        <div class="form-group">
            <label for="specs">Specification Files (2-5 files)</label>
            <input type="file" id="specs" name="specs" accept=".json,.yaml,.yml" multiple required>
            <small>Select 2-5 JSON or YAML files (max 1MB each)</small>
        </div>

        <div class="form-group">
            <label for="strategy">Collision Strategy</label>
            <select id="strategy" name="strategy">
                <option value="rename" selected>Rename (append suffix to duplicates)</option>
                <option value="first">First (keep first occurrence)</option>
                <option value="error">Error (fail on collision)</option>
            </select>
            <small>How to handle conflicting schema/path names</small>
        </div>

        <button type="submit" class="btn">
            Join Specifications
            <span id="spinner" class="spinner htmx-indicator"></span>
        </button>
    </form>

    <div id="result"></div>
</section>
{{end}}

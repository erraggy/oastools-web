# Petstore API with Fixable Issues
# This spec demonstrates issues that the oastools fixer can automatically repair.
# Run: oastools fix --prune-schemas --prune-paths --fix-duplicate-operationids --stub-missing-refs petstore-messy.yaml

openapi: "3.0.3"
info:
  title: Petstore API (Messy)
  description: |
    A sample API with common issues that can be automatically fixed:
    - Missing path parameter declarations
    - Duplicate operationId values
    - Unused schemas in components
    - Empty path items
    - Unresolved $ref pointers (stub-missing-refs)
  version: "1.0.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://petstore.example.com/api/v1
    description: Production server
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      description: Returns all pets from the system.
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPet
      summary: Create a pet
      description: Creates a new pet in the store.
      tags:
        - pets
      requestBody:
        description: Pet to add to the store
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # FIXABLE ISSUE 1: Missing path parameter declaration
  # The path contains {petId} but no parameter object declares it.
  # The fixer will add a parameter object for petId automatically.
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      description: Returns a pet based on a single ID.
      tags:
        - pets
      # NOTE: Missing petId parameter declaration here!
      # The fixer will add: { name: petId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      # FIXABLE ISSUE 2: Duplicate operationId
      # This operationId is the same as the GET operation above.
      # The fixer will rename this to getPetById2 (or similar based on config).
      operationId: getPetById
      summary: Delete a pet
      description: Deletes a pet by ID.
      tags:
        - pets
      # Also missing petId parameter - fixer will add it
      responses:
        "204":
          description: Pet deleted successfully
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # FIXABLE ISSUE 3: Another missing path parameter
  # Path has {ownerId} but no parameter declared.
  /owners/{ownerId}/pets:
    get:
      # FIXABLE ISSUE 2 (continued): Another duplicate operationId
      # Same operationId as /pets GET - fixer will rename to listPets2
      operationId: listPets
      summary: List pets by owner
      description: Returns all pets belonging to a specific owner.
      tags:
        - pets
        - owners
      # NOTE: Missing ownerId parameter declaration!
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # FIXABLE ISSUE 4: Unresolved $ref pointers
  # These references point to schemas and responses that don't exist.
  # The stub-missing-refs fixer creates empty definitions for them.
  /pets/{petId}/toys:
    get:
      operationId: listPetToys
      summary: List toys for a pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A list of toys
          content:
            application/json:
              schema:
                type: array
                items:
                  # Missing schema - fixer will create a stub definition
                  $ref: "#/components/schemas/Toy"
        # Missing response - fixer will create a stub response
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: addPetToy
      summary: Add a toy for a pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Another missing schema reference
              $ref: "#/components/schemas/NewToy"
      responses:
        "201":
          description: Toy added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Toy"

  # FIXABLE ISSUE 5: Empty path item
  # This path has parameters but no HTTP operations (no get, post, put, etc.)
  # The fixer will remove this empty path item when --prune-empty is enabled.
  /deprecated/endpoint:
    # Only has parameters, no operations - this is an empty path item
    parameters:
      - name: version
        in: query
        schema:
          type: string

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the pet
        name:
          type: string
          description: Name of the pet
        tag:
          type: string
          description: Optional tag for the pet
        ownerId:
          type: integer
          format: int64
          description: ID of the pet owner

    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the pet
        tag:
          type: string
          description: Optional tag for the pet

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message

    # FIXABLE ISSUE 6: Unused schema
    # This schema is never referenced anywhere in the document.
    # The fixer will remove it when --prune-unused is enabled.
    LegacyPetFormat:
      type: object
      description: |
        Old pet format that is no longer used anywhere.
        This schema will be removed by the fixer.
      properties:
        pet_id:
          type: string
        pet_name:
          type: string
        pet_type:
          type: string
          enum:
            - dog
            - cat
            - bird
            - fish

    # FIXABLE ISSUE 6 (continued): Another unused schema
    DeprecatedResponse:
      type: object
      description: Response format that is never referenced.
      properties:
        success:
          type: boolean
        data:
          type: object

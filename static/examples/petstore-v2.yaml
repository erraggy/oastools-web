openapi: "3.0.3"
info:
  title: Petstore API
  description: A sample API that uses a petstore as an example to demonstrate features in the OpenAPI 3.0 specification.
  version: "2.0.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://petstore.example.com/api/v1
    description: Production server
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      description: Returns all pets from the system that the user has access to.
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            format: int32
            maximum: 100
        # NON-BREAKING: Added optional query parameter for pagination
        - name: offset
          in: query
          description: Number of pets to skip for pagination
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPet
      summary: Create a pet
      description: Creates a new pet in the store.
      tags:
        - pets
      requestBody:
        description: Pet to add to the store
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      description: Returns a pet based on a single ID.
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          description: ID of pet to fetch
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Pet details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePet
      summary: Delete a pet
      description: Deletes a pet by ID.
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          description: ID of pet to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Pet deleted successfully
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # NON-BREAKING: Added new endpoint for pet photos
  /pets/{petId}/photos:
    get:
      operationId: listPetPhotos
      summary: List photos for a pet
      description: Returns all photos associated with a specific pet.
      tags:
        - pets
        - photos
      parameters:
        - name: petId
          in: path
          description: ID of pet to fetch photos for
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: A list of photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Photo"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: uploadPetPhoto
      summary: Upload a photo for a pet
      description: Uploads a new photo for the specified pet.
      tags:
        - pets
        - photos
      parameters:
        - name: petId
          in: path
          description: ID of pet to upload photo for
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        description: Photo to upload
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPhoto"
      responses:
        "201":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Photo"
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the pet
        name:
          type: string
          description: Name of the pet
        tag:
          type: string
          description: Optional tag for the pet
        # NON-BREAKING: Added optional property
        breed:
          type: string
          description: Breed of the pet
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the pet
        tag:
          type: string
          description: Optional tag for the pet
        # NON-BREAKING: Added optional property to match Pet schema
        breed:
          type: string
          description: Breed of the pet
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: Error code
        message:
          type: string
          description: Error message
    # NON-BREAKING: Added new schema
    Photo:
      type: object
      required:
        - id
        - url
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the photo
        url:
          type: string
          format: uri
          description: URL of the photo
        caption:
          type: string
          description: Optional caption for the photo
    # NON-BREAKING: Added new schema for creating photos
    NewPhoto:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: URL of the photo
        caption:
          type: string
          description: Optional caption for the photo
